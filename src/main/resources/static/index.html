<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySpace</title>
  <link rel="icon" type="image/png" href="/assets/studyspace-logo.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <img class="brand-logo" src="/assets/studyspace-logo.png" alt="StudySpace 로고" width="80" height="80">
    <p class="eyebrow">STUDYSPACE</p>
    <h1>나만의 학습 공간</h1>
    <p class="muted">강의노트와 복습을 한곳에서 관리하세요.</p>
  </section>
  <section id="auth-card" class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="login">로그인</button>
      <button class="tab" data-mode="signup">회원가입</button>
    </div>
    <form id="auth-form">
      <label>이메일<input id="email" type="email" autocomplete="email" required></label>
      <label id="nickname-label" class="hidden">닉네임<input id="nickname" maxlength="50" autocomplete="nickname"></label>
      <label>비밀번호<input id="password" type="password" minlength="8" autocomplete="current-password" required></label>
      <button class="primary" type="submit" id="submit-button">로그인</button>
    </form>
    <a class="kakao" href="/api/auth/kakao">카카오로 로그인</a>
    <p id="message" class="message" role="status"></p>
  </section>
  <section id="account-card" class="card hidden">
    <p class="eyebrow">ACCOUNT</p>
    <h2 id="welcome"></h2>
    <p id="account-detail" class="muted"></p>
    <button class="secondary" id="logout-button">로그아웃</button>
  </section>
</main>
<section id="study" class="study hidden" aria-label="학습 공간">
  <aside class="card">
    <h2>내 과목</h2>
    <form id="course-form">
      <label>학기<input id="semester" placeholder="2026년 2학기" maxlength="40" required></label>
      <label>과목명<input id="course-name" maxlength="120" required></label>
      <button class="primary">과목 추가</button>
    </form>
    <div id="courses"></div>
  </aside>
  <section class="card">
    <h2 id="course-heading">과목을 선택하세요</h2>
    <button id="new-note" class="secondary" disabled>새 강의노트</button>
    <div id="notes"></div>
  </section>
  <section class="card">
    <h2>강의노트</h2>
    <form id="note-form" class="hidden">
      <label>제목<input id="note-title" maxlength="200" required></label>
      <label>Markdown 본문<textarea id="note-body" rows="20" maxlength="60000"></textarea></label>
      <button id="save-note" class="primary">저장</button>
      <button id="export-note" class="secondary" type="button">Markdown 다운로드</button>
    </form>
    <p id="study-message" role="status">과목을 추가하고 첫 노트를 작성해 보세요.</p>
  </section>
</section>
<script src="/app.js" defer></script>
</body>
</html>
