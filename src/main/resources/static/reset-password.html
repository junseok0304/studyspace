<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudySpace | 비밀번호 재설정</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=1">
  <link rel="apple-touch-icon" href="/assets/studyspace-logo.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="shell auth-shell auth-compact-shell">
  <section class="card">
    <p class="eyebrow auth-kicker">계정 찾기</p>
    <h1 id="reset-heading">비밀번호 재설정</h1>
    <p id="reset-intro" class="auth-intro">가입할 때 사용한 이메일을 입력해 주세요.</p>
    <form id="request-form">
      <label>이메일<input id="reset-email" type="email" autocomplete="email" maxlength="254" required></label>
      <button class="primary" type="submit">재설정 링크 받기</button>
    </form>
    <form id="confirm-form" class="hidden">
      <label>새 비밀번호<input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <label>새 비밀번호 확인<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <button class="primary" type="submit">비밀번호 변경</button>
    </form>
    <p id="reset-message" class="message" role="status"></p>
    <p class="auth-foot"><a href="/">로그인으로 돌아가기</a></p>
  </section>
</main>
<script type="module" src="/reset-password.js"></script>
</body>
</html>
