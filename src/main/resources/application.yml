server:
  port: ${STUDYSPACE_PORT:8091}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${STUDYSPACE_COOKIE_SECURE:false}

spring:
  mail:
    host: ${STUDYSPACE_MAIL_HOST:}
    port: ${STUDYSPACE_MAIL_PORT:587}
    username: ${STUDYSPACE_MAIL_USERNAME:}
    password: ${STUDYSPACE_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${STUDYSPACE_MAIL_AUTH:true}
          starttls:
            enable: ${STUDYSPACE_MAIL_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: ${STUDYSPACE_MAX_FILE_SIZE:50MB}
      max-request-size: ${STUDYSPACE_MAX_REQUEST_SIZE:52MB}
  datasource:
    url: ${STUDYSPACE_DB_URL:jdbc:h2:file:./runtime/studyspace;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${STUDYSPACE_DB_USERNAME:sa}
    password: ${STUDYSPACE_DB_PASSWORD:}
    driver-class-name: ${STUDYSPACE_DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

studyspace:
  auth:
    require-email-verification: ${STUDYSPACE_REQUIRE_EMAIL_VERIFICATION:false}
    expose-development-links: ${STUDYSPACE_EXPOSE_DEV_AUTH_LINKS:false}
    public-base-url: ${STUDYSPACE_PUBLIC_BASE_URL:http://localhost:8091}
    mail-from: ${STUDYSPACE_MAIL_FROM:no-reply@studyspace.omong.kr}
  features:
    stt:
      enabled: false
  kakao:
    enabled: ${STUDYSPACE_KAKAO_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    javascript-key: ${KAKAO_JAVASCRIPT_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    client-secret-required: ${KAKAO_CLIENT_SECRET_REQUIRED:true}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8091/api/auth/kakao/callback}
    public-base-url: ${STUDYSPACE_PUBLIC_BASE_URL:http://localhost:8091}
  ai:
    model: ${STUDYSPACE_AI_MODEL:gemini-3.6-flash}
    mock-enabled: ${STUDYSPACE_AI_MOCK_ENABLED:true}
    gemini-api-key: ${GEMINI_API_KEY:}

logging:
  level:
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
