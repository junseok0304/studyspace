services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studyspace
      MYSQL_USER: studyspace
      MYSQL_PASSWORD: ${STUDYSPACE_DB_PASSWORD:?set STUDYSPACE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - studyspace-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u studyspace -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      STUDYSPACE_PORT: 8091
      STUDYSPACE_DB_URL: jdbc:mysql://db:3306/studyspace?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      STUDYSPACE_DB_USERNAME: studyspace
      STUDYSPACE_DB_PASSWORD: ${STUDYSPACE_DB_PASSWORD:?set STUDYSPACE_DB_PASSWORD in .env}
      STUDYSPACE_DB_DRIVER: com.mysql.cj.jdbc.Driver
      STUDYSPACE_UPLOAD_DIR: /app/runtime/uploads
      STUDYSPACE_RECORDING_DIR: /app/runtime/recordings
      STUDYSPACE_COOKIE_SECURE: ${STUDYSPACE_COOKIE_SECURE:-true}
      STUDYSPACE_REQUIRE_EMAIL_VERIFICATION: ${STUDYSPACE_REQUIRE_EMAIL_VERIFICATION:-false}
      STUDYSPACE_KAKAO_ENABLED: ${STUDYSPACE_KAKAO_ENABLED:-false}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_JAVASCRIPT_KEY: ${KAKAO_JAVASCRIPT_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_CLIENT_SECRET_REQUIRED: ${KAKAO_CLIENT_SECRET_REQUIRED:-true}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://studyspace.omong.kr/api/auth/kakao/callback}
      STUDYSPACE_PUBLIC_BASE_URL: ${STUDYSPACE_PUBLIC_BASE_URL:-https://studyspace.omong.kr}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STUDYSPACE_AI_MOCK_ENABLED: ${STUDYSPACE_AI_MOCK_ENABLED:-true}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - studyspace-runtime:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  studyspace-db:
    name: studyspace-db
  studyspace-runtime:
    name: studyspace-runtime
